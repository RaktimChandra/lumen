# Render Blueprint: PostgreSQL + the API, in the Singapore region (closest to Chennai).
databases:
  - name: lumen-db
    plan: free
    region: singapore
    databaseName: lumen
    user: lumen
    postgresMajorVersion: '16'

services:
  - type: web
    name: lumen-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start -w @lumen/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'false'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Browser traffic arrives via the Vercel rewrite (Vercel edge + Render proxy).
      - key: TRUST_PROXY
        value: '2'
      - key: CORS_ORIGINS
        value: https://lumen-pm.vercel.app
      - key: COOKIE_SAMESITE
        value: strict
