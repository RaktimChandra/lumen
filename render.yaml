# Render Blueprint: PostgreSQL + one web service that serves the API and the web app,
# in the Singapore region (closest to Chennai).
databases:
  - name: lumen-db
    plan: free
    region: singapore
    databaseName: lumen
    user: lumen
    postgresMajorVersion: '16'

services:
  - type: web
    name: lumen-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w @lumen/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'false'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # The API also serves the web app, so browser traffic is same-origin.
      - key: TRUST_PROXY
        value: '1'
      - key: CORS_ORIGINS
        value: https://lumen-api-x4be.onrender.com
      - key: COOKIE_SAMESITE
        value: strict
