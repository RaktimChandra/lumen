name: Android APK

# Builds a release APK on GitHub's runners (no Expo account needed) and attaches it
# to a GitHub Release for tagged versions.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL baked into the app
        required: false
        default: https://lumen-api-x4be.onrender.com
      release_tag:
        description: Publish the APK as a GitHub Release with this tag (e.g. v1.0.0); leave empty to only upload an artifact
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.LUMEN_API_URL || 'https://lumen-api-x4be.onrender.com' }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build:shared
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Name the APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          NAME="${RELEASE_TAG:-${GITHUB_REF_NAME//\//-}}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/lumen-${NAME}.apk"
          ls -lh dist
      - uses: actions/upload-artifact@v6
        with:
          name: lumen-android-apk
          path: dist/*.apk
          retention-days: 30
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Lumen ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Live app:** https://lumen-api-x4be.onrender.com (API docs: https://lumen-api-x4be.onrender.com/api/docs)
            **Demo account:** demo@lumen.dev / LumenDemo2026

            **Android:** download the APK below, allow installs from your browser when Android asks, and sign in with the same account you use on the web. The app talks to the live API above. The free hosting tier sleeps when idle, so the first request can take up to a minute.
