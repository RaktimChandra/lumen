name: Keep demo API warm

# Render's free tier sleeps after 15 idle minutes. Pinging the health check keeps the
# demo responsive for reviewers. Remove this workflow on a paid plan.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.LUMEN_API_URL || 'https://lumen-api.onrender.com' }}/api/health"
